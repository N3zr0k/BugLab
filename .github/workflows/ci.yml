# CI/CD für BugLab: Lint -> Tests -> ZIP -> Release (+ CurseForge ab beta).
# Release-Stufe aus der TOC-Version (x.y.z-stufe.N):
#   alpha   -> GitHub-Prerelease, kein CurseForge
#   beta    -> GitHub-Release (Beta) und CurseForge-Beta
#   (keine) -> GitHub-Release und CurseForge-Release
# Benötigt: nur das GitHub-Secret CF_API_KEY.
# Spielversionen werden aus ## Interface in der BugLab.toc gelesen;
# die passenden CurseForge-IDs ermittelt die Game Versions API beim Upload.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      retry_curseforge:
        description: 'CurseForge-Upload für bestehendes Beta-/Final-Release wiederholen'
        required: false
        type: boolean
        default: false

env:
  ADDON: BugLab
  CURSEFORGE_PROJECT_ID: "1755124"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.toc.outputs.version }}
      stage: ${{ steps.toc.outputs.stage }}
      game_versions: ${{ steps.toc.outputs.game_versions }}
    steps:
      - uses: actions/checkout@v4
      # Die TOC ist die einzige Quelle für Addon- und Client-Versionen.
      - id: toc
        run: |
          VERSION=$(sed -n 's/^## Version:[[:space:]]*//p' "$ADDON/$ADDON.toc" | tr -d '\r')
          test -n "$VERSION" || { echo "Keine Version in der TOC"; exit 1; }
          case "$VERSION" in
            *-alpha.*) STAGE=alpha ;;
            *-beta.*)  STAGE=beta ;;
            *-*)       echo "Unbekannte Stufe in $VERSION"; exit 1 ;;
            *)         STAGE=release ;;
          esac
          # ## Interface: 16001 -> 1.60.1, 120105 -> 12.1.5 usw.
          # Mehrere Interface-Nummern (Kommaliste) werden vollständig berücksichtigt.
          INTERFACES=$(sed -nE 's/^##[[:space:]]*Interface[[:space:]]*:[[:space:]]*([^#]*).*/\1/p' "$ADDON/$ADDON.toc" | tr -d '[:space:]')
          if [ -z "$INTERFACES" ]; then
            echo "::error::## Interface fehlt in $ADDON/$ADDON.toc"
            exit 1
          fi
          IFS=',' read -r -a IDS <<< "$INTERFACES"
          VERSION_NAMES=()
          for iface in "${IDS[@]}"; do
            if ! [[ "$iface" =~ ^[0-9]{5,6}$ ]]; then
              echo "::error::Ungültige Interface-Nummer in der TOC: $iface"
              exit 1
            fi
            number=$((10#$iface))
            major=$((number / 10000))
            minor=$(((number % 10000) / 100))
            patch=$((number % 100))
            VERSION_NAMES+=("$major.$minor.$patch")
          done
          GAME_VERSION_NAMES=$(IFS=,; echo "${VERSION_NAMES[*]}")
          echo "TOC Interfaces: $INTERFACES -> CurseForge-Spielversionen: $GAME_VERSION_NAMES"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "game_versions=$GAME_VERSION_NAMES" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lunarmodules/luacheck@v1
        with:
          args: BugLab tests --codes

  # Logiktests mit simuliertem WoW-Client (tests/run_addon.py), enUS und deDE.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lupa
      - run: python3 -I tests/run_addon.py

  # Addon-ZIP für Spieler: ein Wurzelordner BugLab/, ohne Repo-Dateien.
  package:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: zip -qr "${ADDON}_${{ needs.version.outputs.version }}.zip" "$ADDON" -x "*/.git*" "*__pycache__*"
      - uses: actions/upload-artifact@v4
        with:
          name: addon-zip
          path: "*.zip"

  # Tag + Release, nur auf dem Standardbranch und nur, wenn die TOC-Version neu ist.
  release:
    needs: [version, lint, test, package]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.release.outputs.created }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      STAGE: ${{ needs.version.outputs.stage }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: addon-zip
      - id: release
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG existiert bereits, nichts zu tun."
            echo "created=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Release-Beschreibung = Abschnitt der Version aus dem CHANGELOG
          awk -v v="## $VERSION" '$0 ~ "^## " { p = ($0 == v) } p && $0 != v' CHANGELOG.md > notes.md
          TITLE="$ADDON $VERSION"
          FLAGS=""
          [ "$STAGE" = "alpha" ] && FLAGS="--prerelease" && TITLE="$TITLE (Prerelease)"
          [ "$STAGE" = "beta" ] && TITLE="$TITLE (Beta)"
          gh release create "$TAG" "${ADDON}_${VERSION}.zip" --target "$GITHUB_SHA" --title "$TITLE" --notes-file notes.md $FLAGS
          echo "created=true" >> "$GITHUB_OUTPUT"

  # CurseForge: automatisch bei neuen beta/final Releases; Retry manuell via Actions.
  curseforge:
    needs: [version, release]
    if: >-
      needs.release.result == 'success' &&
      needs.version.outputs.stage != 'alpha' &&
      (needs.release.outputs.created == 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.retry_curseforge == true))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
      STAGE: ${{ needs.version.outputs.stage }}
      GAME_VERSION_NAMES: ${{ needs.version.outputs.game_versions }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      # Immer das ZIP aus dem GitHub-Release nutzen, damit Retry exakt dasselbe Paket hochlädt.
      - name: Download GitHub release asset
        run: gh release download "v$VERSION" --pattern "${ADDON}_${VERSION}.zip" --dir . --clobber
      - name: Upload to CurseForge
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CF_API_KEY }}
        run: |
          if [ -z "$CURSEFORGE_API_TOKEN" ]; then
            echo "::error::GitHub Secret CF_API_KEY fehlt"
            exit 1
          fi
          # CurseForge nutzt eigene IDs. Diese bei jedem Upload anhand der TOC-Versionen
          # dynamisch auflösen, statt eine Repository-Variable vorauszusetzen.
          curl --fail-with-body -sS --retry 3 \
            --header "X-Api-Token: $CURSEFORGE_API_TOKEN" \
            --output game-versions.json \
            "https://wow.curseforge.com/api/game/versions"
          if ! jq -e 'type == "array"' game-versions.json > /dev/null; then
            echo "::error::CurseForge hat keine gültige Liste von Spielversionen geliefert"
            exit 1
          fi
          RESOLVED=$(jq -c --arg names "$GAME_VERSION_NAMES" '
            ($names | split(",") | unique) as $wanted |
            [.[] | select(.name as $n | $wanted | index($n) != null) | {name, id}] as $matches |
            {ids: ($matches | map(.id) | unique), missing: ($wanted - ($matches | map(.name)))}
          ' game-versions.json)
          MISSING=$(jq -r '.missing | join(", ")' <<< "$RESOLVED")
          if [ -n "$MISSING" ]; then
            echo "::error::Für folgende TOC-Spielversionen fehlt eine Zuordnung bei CurseForge: $MISSING"
            exit 1
          fi
          GAME_VERSION_IDS=$(jq -c '.ids' <<< "$RESOLVED")
          if [ "$GAME_VERSION_IDS" = '[]' ]; then
            echo "::error::Keine CurseForge-Game-Version-ID gefunden"
            exit 1
          fi
          echo "TOC-Spielversionen: $GAME_VERSION_NAMES -> CurseForge-IDs: $GAME_VERSION_IDS"
          NOTES=$(awk -v v="## $VERSION" '$0 ~ "^## " { p = ($0 == v) } p && $0 != v' CHANGELOG.md)
          TYPE=release; [ "$STAGE" = "beta" ] && TYPE=beta
          jq -n --arg notes "$NOTES" --arg name "$ADDON $VERSION" --arg type "$TYPE" --argjson gv "$GAME_VERSION_IDS" \
            '{changelog:$notes, changelogType:"markdown", displayName:$name, gameVersions:$gv, releaseType:$type}' > metadata.json
          curl --fail-with-body -sS --retry 3 --request POST --header "X-Api-Token: $CURSEFORGE_API_TOKEN" \
               --form "metadata=<metadata.json" --form "file=@${ADDON}_${VERSION}.zip" \
               "https://wow.curseforge.com/api/projects/$CURSEFORGE_PROJECT_ID/upload-file"
